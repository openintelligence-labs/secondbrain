<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SecondBrain · Search</title>
    <style>
      :root {
        --overlay-pad: 14px;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        height: 100vh;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        padding: 0;
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        background: rgba(9, 9, 11, 0.82);
        border: 1px solid var(--hairline-strong);
      }

      .head {
        padding: 16px 22px 14px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--hairline);
      }
      .prefix {
        font-family: var(--editorial);
        font-style: italic;
        font-size: 18px;
        color: var(--amber);
        letter-spacing: -0.01em;
      }
      .head input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--ink-100);
        font-family: var(--mono);
        font-size: 17px;
        line-height: 1;
        padding: 6px 0;
        caret-color: var(--amber);
      }
      .head input::placeholder {
        color: var(--ink-500);
      }
      .head .esc-hint {
        font-size: 10px;
        color: var(--ink-500);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .head .esc-hint kbd {
        font-family: var(--mono);
        background: var(--ink-800);
        border: 1px solid var(--hairline);
        color: var(--ink-200);
        padding: 1px 6px;
        font-size: 10px;
      }

      .results {
        overflow-y: auto;
      }
      .result {
        display: grid;
        grid-template-columns: 90px 1fr 56px;
        gap: 16px;
        padding: 12px 22px;
        border-top: 1px solid var(--hairline);
        cursor: pointer;
        animation: result-in 120ms ease-out both;
      }
      .result.active {
        background: rgba(251, 191, 36, 0.06);
        border-left: 2px solid var(--amber);
        padding-left: 20px;
      }
      .result:hover {
        background: rgba(255, 255, 255, 0.025);
      }
      .result .meta {
        color: var(--ink-400);
        font-size: var(--font-size-sm);
        font-variant-numeric: tabular-nums;
      }
      .result .body {
        color: var(--ink-200);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .result .score {
        text-align: right;
        font-size: 10px;
        color: var(--ink-500);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }
      .result mark {
        background: transparent;
        color: var(--amber);
        font-weight: 500;
      }

      .foot {
        padding: 8px 22px;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-500);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--hairline);
      }
      .foot kbd {
        font-family: var(--mono);
        background: var(--ink-800);
        border: 1px solid var(--hairline);
        color: var(--ink-300);
        padding: 1px 5px;
        font-size: 10px;
      }
      .empty {
        padding: 36px 0;
        text-align: center;
        color: var(--ink-500);
        font-size: var(--font-size-sm);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      @keyframes result-in {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body data-theme="dark">
    <div class="head">
      <span class="prefix">⌕</span>
      <input
        id="q"
        placeholder="search your memory — try 'snowflake migration friday'…"
        autocomplete="off"
        autofocus
        spellcheck="false"
      />
      <span class="esc-hint"><kbd>esc</kbd> close</span>
    </div>
    <div class="results" id="results">
      <div class="empty">type to search</div>
    </div>
    <div class="foot">
      <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
      <span id="meta">—</span>
      <span><kbd>↵</kbd> open in timeline</span>
    </div>
    <script type="module" src="/src/search.ts"></script>
  </body>
</html>
