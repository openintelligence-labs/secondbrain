[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain-ai"
version = "0.3.1"
description = "Local-first personal memory daemon for macOS — captures, indexes, and exposes your screen-time history to MCP-aware AI assistants."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Runtime deps. Heavy ML deps (sentence-transformers, lancedb, kuzu, tantivy,
# colpali) get pulled in transitively via `actants[*]` extras and the embedder
# modules — listing them again here is intentional so a clean `pip install -e .`
# resolves on a fresh machine without hidden surprises.
dependencies = [
    "actants>=0.5",
    "aiohttp>=3.9",
    "click>=8.1",
    "cryptography>=42.0",
    "kuzu>=0.4",
    "keyring>=24.0",
    "lancedb>=0.10",
    "mcp>=1.0,<2",  # mcp 2.0 removed mcp.server.fastmcp; unpin only after a 2.x compat pass
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "scikit-image>=0.22",
    "PyYAML>=6.0",
    "sqlcipher3-wheels>=0.5",
    "structlog>=24.1",
    "tantivy>=0.22",
    # PyObjC: macOS AX-tree walker imports ApplicationServices and Cocoa at
    # module load when sys.platform == "darwin". Install only on macOS so
    # CI/users on other OSes don't pull these in for nothing.
    "pyobjc-core>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17"]

# Local text embeddings + cross-encoder reranker. Without this, `secondbrain
# index` and `secondbrain search --rerank` fall back to actants/Ollama-served
# embeddings (or the stub embedder for tests/demos).
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

# Visual recall via ColQwen2.5 late-interaction. Heavy — ~2 GB of model
# weights on first use. Only needed for `secondbrain run --visual`.
visual = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "colpali-engine>=0.3",
]

# BYO-LLM extras — install when pointing SECONDBRAIN_LLM_PROVIDER at a hosted
# provider. Each extra pulls actants's matching extra, which in turn installs
# the upstream SDK (openai, anthropic, etc.) and registers the provider class.
openai = ["actants[openai]>=0.5"]
anthropic = ["actants[anthropic]>=0.5"]
gemini = ["actants[gemini]>=0.5"]
groq = ["actants[groq]>=0.5"]
mistral = ["actants[mistral]>=0.5"]
# Convenience: every BYO-LLM provider in one shot.
byo-llm = [
    "actants[openai]>=0.5",
    "actants[anthropic]>=0.5",
    "actants[gemini]>=0.5",
    "actants[groq]>=0.5",
    "actants[mistral]>=0.5",
]

[project.scripts]
secondbrain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "SIM"]
