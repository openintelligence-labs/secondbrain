name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        # macOS sidecar tests (test_macos_sck.py, test_ocr.py) self-skip when
        # the Swift binary isn't built; Ollama-dependent tests self-skip when
        # 127.0.0.1:11434 isn't reachable. So pytest tests/ is safe here.
        env:
          SECONDBRAIN_SKIP_LLM_TESTS: "1"
        run: pytest tests/ -q
